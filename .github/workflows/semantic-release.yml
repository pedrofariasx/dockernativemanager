name: Semantic Release

on:
  push:
    branches: [main, dev]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-22.04
    outputs:
      new_tag: ${{ steps.new-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get current tag
        id: current-tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')" >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect new tag
        id: new-tag
        run: |
          PREV="${{ steps.current-tag.outputs.tag }}"
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')"
          if [ "$PREV" != "$NEW" ]; then
            echo "tag=$NEW" >> "$GITHUB_OUTPUT"
            echo "New release detected: $NEW"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No new release"
          fi

  build:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config fakeroot rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.new_tag }}"
          TAURI_CONF="src-tauri/tauri.conf.json"
          ORIGINAL_VERSION="$(python3 -c "import json;print(json.load(open('$TAURI_CONF'))['version'])")"
          NORMALIZED_VERSION="${ORIGINAL_VERSION//-/_}"
          TAG_VERSION="${TAG#v}"

          echo "Release tag: $TAG"
          echo "Tauri version (original): $ORIGINAL_VERSION"
          echo "Tauri version (build): $NORMALIZED_VERSION"

          if [[ "$TAG_VERSION" != "$ORIGINAL_VERSION" ]]; then
            echo "::warning::tag version ($TAG_VERSION) differs from tauri.conf version ($ORIGINAL_VERSION)"
          fi

          if [[ "$NORMALIZED_VERSION" != "$ORIGINAL_VERSION" ]]; then
            cp "$TAURI_CONF" "$TAURI_CONF.bak"
            trap 'mv "$TAURI_CONF.bak" "$TAURI_CONF"' EXIT

            jq --arg version "$NORMALIZED_VERSION" '.version = $version' \
              "$TAURI_CONF" > "$TAURI_CONF.tmp"
            mv "$TAURI_CONF.tmp" "$TAURI_CONF"

            UPDATED_VERSION="$(python3 -c "import json;print(json.load(open('$TAURI_CONF'))['version'])")"
            if [[ "$UPDATED_VERSION" != "$NORMALIZED_VERSION" ]]; then
              echo "::error::failed to normalize tauri build version"
              exit 1
            fi
          fi

          pnpm tauri build --bundles appimage,deb,rpm

      - name: Upload AppImage, deb, rpm to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.new_tag }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"

          for dir in appimage deb rpm; do
            for f in "$BUNDLE_DIR/$dir/"*; do
              # o glob não casa quando o diretório não existe.
              # com `bash -e`, um teste falso abortaria o passo.
              if [ -f "$f" ]; then
                gh release upload "$TAG" "$f" --clobber
              fi
            done
          done

      - name: Package tar.gz and Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release.outputs.new_tag }}"
          mkdir -p dist-targz

          BIN_PATH="src-tauri/target/release/docker-native-manager"
          if [ ! -f "$BIN_PATH" ]; then
            echo "Expected binary not found at $BIN_PATH"
            exit 1
          fi

          PKG_VERSION="${TAG#v}"

          cp "$BIN_PATH" dist-targz/
          cp LICENSE dist-targz/

          TAR_GZ="Docker.Native.Manager_${PKG_VERSION}_amd64.tar.gz"
          tar -C dist-targz -czf "$TAR_GZ" docker-native-manager LICENSE

          gh release upload "$TAG" "$TAR_GZ" --clobber
